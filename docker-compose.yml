x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: earthquake-monitoring-airflow:2.10.4
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW_CONN_POSTGRES_ETL: postgresql://etl_ud:P4$$w0rd@postgres:5432/earthquakes_ud
    AIRFLOW_CONN_FS_DEFAULT: 'fs://?path=%2Fopt%2Fairflow'
    PYTHONPATH: /opt/airflow
    JAVA_HOME: /usr/lib/jvm/default-java
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./datalake_bronze:/opt/airflow/datalake_bronze
    - ./datalake_silver:/opt/airflow/datalake_silver
    - ./datalake_gold:/opt/airflow/datalake_gold
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./workshop_1:/opt/airflow/workshop_1
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow --password airflow \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com
    depends_on:
      <<: *airflow-depends
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard-governance:
    image: earthquake-monitoring-airflow:2.10.4
    command: python -m dashboard.governance_app
    ports:
      - "8050:8050"
    environment:
      PYTHONPATH: /opt/airflow
      GOLD_DIR: /opt/airflow/datalake_gold
      DASH_HOST: 0.0.0.0
      DASH_PORT: "8050"
    volumes:
      - ./dashboard:/opt/airflow/dashboard
      - ./datalake_gold:/opt/airflow/datalake_gold:ro
      - ./docs:/opt/airflow/docs:ro
    depends_on:
      airflow-webserver:
        condition: service_started

  dashboard-storytelling:
    image: earthquake-monitoring-airflow:2.10.4
    command: python -m dashboard.storytelling_app
    ports:
      - "8051:8051"
    environment:
      PYTHONPATH: /opt/airflow
      GOLD_DIR: /opt/airflow/datalake_gold
      DASH_HOST: 0.0.0.0
      DASH_PORT: "8051"
    volumes:
      - ./dashboard:/opt/airflow/dashboard
      - ./datalake_gold:/opt/airflow/datalake_gold:ro
      - ./docs:/opt/airflow/docs:ro
    depends_on:
      airflow-webserver:
        condition: service_started

volumes:
  postgres-data: