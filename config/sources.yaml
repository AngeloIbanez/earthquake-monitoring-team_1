version: "1.0"
hazard: "earthquake"
scope: "global"

sources:
  usgs_fdsn_historical:
    id: "usgs_fdsn"
    name: "USGS Earthquake Hazards Program - FDSN Event Web Service"
    type: "historical"
    owner: "United States Geological Survey (USGS)"
    base_url: "https://earthquake.usgs.gov/fdsnws/event/1/query"
    format: "geojson"
    access_method: "REST API (GET)"
    auth_required: false
    rate_limits:
      max_records_per_request: 20000
      requests_per_minute: 60
    license: "Public Domain (U.S. Government Work)"
    attribution: "U.S. Geological Survey"
    parameters:
      format: "geojson"
      minmagnitude: 2.5
      orderby: "time-asc"
    historical_strategy:
      partition_by: "month"
      start_date: "2020-01-01"
      end_date: "2025-12-31"

  emsc_fdsn_historical:
    id: "emsc_fdsn"
    name: "EMSC Seismic Portal - FDSN Web Service"
    type: "historical"
    owner: "Euro-Mediterranean Seismological Centre (EMSC)"
    base_url: "https://www.seismicportal.eu/fdsnws/event/1/query"
    format: "json"
    access_method: "REST API (GET)"
    auth_required: false
    rate_limits:
      max_records_per_request: 10000
      requests_per_minute: 30
    license: "Open Data (EMSC Terms of Use)"
    attribution: "Euro-Mediterranean Seismological Centre (EMSC)"
    parameters:
      format: "json"
      minmag: 2.5
      limit: 10000
    historical_strategy:
      partition_by: "month"
      start_date: "2020-01-01"
      end_date: "2025-12-31"

  usgs_geojson_incremental:
    id: "usgs_realtime"
    name: "USGS Real-time GeoJSON Summary Feed"
    type: "incremental"
    owner: "United States Geological Survey (USGS)"
    base_url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/detail/"
    feed_url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
    format: "geojson"
    access_method: "HTTP GET"
    auth_required: false
    update_frequency: "5m"
    rate_limits:
      polling_interval_seconds: 300
    license: "Public Domain"
    attribution: "U.S. Geological Survey"
    watermark:
      field: "properties.updated"
      type: "timestamp_epoch_ms"
      overlap_window_hours: 24

  gdacs_events_incremental:
    id: "gdacs_realtime"
    name: "Global Disaster Alert and Coordination System - RSS 24h Feed"
    type: "incremental"
    owner: "European Commission / Joint Research Centre (JRC)"
    # NOTE: The GeoJSON REST API endpoint (/gdacsapi/api/events/geteventlist/geojson)
    # returned HTTP 404 as of 2026-11-09. The official programmatic interface that
    # remains operational is the RSS 2.0 XML feed at the URL below (confirmed live).
    base_url: "https://www.gdacs.org/xml/rss_24h.xml"
    format: "xml-rss2"
    access_method: "HTTP GET (RSS 2.0 XML feed, polled)"
    auth_required: false
    update_frequency: "15m"
    rate_limits:
      polling_interval_seconds: 900
      notes: "No explicit rate limit documented; cache all downloads per GDACS ToU."
    license: "Open Access (GDACS Attribution required)"
    attribution: "GDACS - European Commission / Joint Research Centre (JRC)"
    # Key XML namespaces used in this feed:
    #   gdacs  -> http://www.gdacs.org
    #   geo    -> http://www.w3.org/2003/01/geo/wgs84_pos#
    #   georss -> http://www.georss.org/georss
    #   dc     -> http://purl.org/dc/elements/1.1/
    parameters:
      filter_eventtype: "EQ"   # applied in-code after fetch (feed covers all hazard types)
    watermark:
      field: "{http://www.gdacs.org}fromdate"   # RFC-822 timestamp of event origin
      type: "rfc822"
      overlap_window_hours: 48
      notes: >
        Records are filtered server-side by eventtype=EQ only after parsing.
        Magnitude is extracted via regex from <gdacs:severity> (e.g. 'Magnitude 6.4M, Depth:17km').
        Coordinates are parsed from <georss:point> ('lat lon' space-separated string).
        No depth field available in this feed; set depth_km = null for all GDACS records.
